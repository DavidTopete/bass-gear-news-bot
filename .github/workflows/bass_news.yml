name: Bass News Bot

on:
  workflow_dispatch:

  schedule:
    # 10:17 AM San Luis Río Colorado (UTC-7) = 17:17 UTC
    # Se usa :17 para reducir retrasos de GitHub Actions
    # que suelen ocurrir al inicio de cada hora.
    - cron: '17 17 * * *'

permissions:
  contents: write

concurrency:
  group: bass-news-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. DESCARGAR REPOSITORIO
      # ======================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ======================================================
      # 2. CONFIGURAR PYTHON
      # ======================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ======================================================
      # 3. MOSTRAR HORA DE EJECUCIÓN
      # ======================================================
      - name: Show execution time
        run: |
          echo "========================================"
          echo "Bass News Bot"
          echo "========================================"
          echo "UTC time:"
          date -u
          echo ""
          echo "Runner time:"
          date
          echo "========================================"


      # ======================================================
      # 4. INSTALAR DEPENDENCIAS
      # ======================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ======================================================
      # 5. EJECUTAR BOT
      # ======================================================
      - name: Run Bass News Bot
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python telegram_bot.py


      # ======================================================
      # 6. GUARDAR HISTORIAL
      # ======================================================
      - name: Save bot history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Checking noticias_enviadas_bass.json..."

          git add noticias_enviadas_bass.json

          if git diff --cached --quiet; then
            echo "No changes in noticias_enviadas_bass.json"
            exit 0
          fi

          echo "Changes detected."

          git commit -m "Update bass news history"

          echo "Updating local repository..."
          git pull --rebase origin main

          echo "Pushing updated history..."
          git push origin HEAD:main

          echo "Bass news history successfully updated."
