name: Bass News Bot

on:
workflow_dispatch:

schedule:
# 10:00 AM hora San Luis Río Colorado / Sonora (UTC-7)
# 10:00 AM = 17:00 UTC
- cron: '0 17 * * *'

permissions:
contents: write

jobs:
run-bot:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Pull latest changes
    run: |
      git pull origin main || true

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - name: Install dependencies
    run: |
      pip install -r requirements.txt

  - name: Run Bass News Bot
    env:
      TOKEN: ${{ secrets.TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
    run: python telegram_bot.py

  - name: Save bot history
    run: |
      git config user.name "github-actions"
      git config user.email "github-actions@github.com"
      git add noticias_enviadas_bass.json
      git commit -m "Update bass news history" || echo "No changes to commit"
      git push
```
